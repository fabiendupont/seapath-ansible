---
# Verify playbook for iptables role testing

- name: Verify
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Verify rules.v4 file exists
      ansible.builtin.stat:
        path: /etc/iptables/rules.v4
      register: rules_file
      failed_when: not rules_file.stat.exists

    - name: Verify rules.v4 has correct permissions
      ansible.builtin.assert:
        that:
          - rules_file.stat.mode == '0644'
        fail_msg: "rules.v4 has incorrect permissions"
        success_msg: "rules.v4 has correct permissions"

    - name: Read rules.v4 content
      ansible.builtin.command: cat /etc/iptables/rules.v4
      register: rules_content
      changed_when: false

    - name: Display rules content
      ansible.builtin.debug:
        msg: "{{ rules_content.stdout_lines }}"

    - name: Verify rules.v4 contains expected content
      ansible.builtin.assert:
        that:
          - "'*filter' in rules_content.stdout"
          - "':INPUT ACCEPT' in rules_content.stdout"
          - "':FORWARD ACCEPT' in rules_content.stdout"
          - "':OUTPUT ACCEPT' in rules_content.stdout"
          - "'COMMIT' in rules_content.stdout"
        fail_msg: "rules.v4 missing required iptables structure"
        success_msg: "rules.v4 has correct structure"

    - name: Verify specific rules are present
      ansible.builtin.assert:
        that:
          - "'-A INPUT -i lo -j ACCEPT' in rules_content.stdout"
          - "'-A INPUT -p tcp -m tcp --dport 22 -j ACCEPT' in rules_content.stdout"
        fail_msg: "Expected iptables rules not found"
        success_msg: "Test iptables rules are present"

    - name: Get current iptables rules
      ansible.builtin.command: iptables-save
      register: current_rules
      changed_when: false

    - name: Verify rules are loaded (check for loopback accept rule)
      ansible.builtin.assert:
        that:
          - "'-A INPUT -i lo -j ACCEPT' in current_rules.stdout"
        fail_msg: "iptables rules not loaded into kernel"
        success_msg: "iptables rules successfully loaded"

    - name: Display verification success
      ansible.builtin.debug:
        msg: "iptables rules successfully deployed and loaded"
