---
# ptp_status_vsock role test scenario
# Compatible with Ansible 2.10 and Molecule 3.x

scenario:
  name: default
  # TODO: Fix idempotence issues before enabling idempotence test
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: ptp-vsock-test
    box: generic/debian12
    memory: 512
    cpus: 1
    groups:
      - test_nodes

provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
      timeout: 30
  env:
    ANSIBLE_COLLECTIONS_PATH: ../../../../collections
    ANSIBLE_ROLES_PATH: ../../../../roles
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      ptp-vsock-test:
        # Enable ptp_status_vsock by defining ptp_interface
        ptp_interface: eth0

verifier:
  name: ansible
