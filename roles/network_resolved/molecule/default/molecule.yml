---
# network_resolved role test scenario
# Compatible with Ansible 2.10 and Molecule 3.x

scenario:
  name: default

dependency:
  name: galaxy
  options:
    requirements-file: shared/requirements.yml
    force: false

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: network-resolved-test
    box: generic/debian12
    memory: 1024
    cpus: 2
    groups:
      - test_nodes
    networks:
      - name: default
        type: dhcp

provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
      timeout: 30
  env:
    ANSIBLE_COLLECTIONS_PATH: ../../../../collections
    ANSIBLE_ROLES_PATH: ../../../../roles
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      test_nodes:
        # Test-specific variables
        ansible_python_interpreter: /usr/bin/python3
        dns_servers: "8.8.8.8 8.8.4.4"

verifier:
  name: ansible
