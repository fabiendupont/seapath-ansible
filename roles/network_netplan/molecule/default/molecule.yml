---
# network_netplan role test scenario
# Compatible with Ansible 2.10 and Molecule 3.x

scenario:
  name: default

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: network-netplan-test
    box: generic/debian12
    memory: 512
    cpus: 1
    groups:
      - test_nodes
    networks:
      - name: default
        type: dhcp
      - name: test-network
        type: dhcp
        auto_config: false

provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
      timeout: 30
  env:
    ANSIBLE_COLLECTIONS_PATH: ../../../../collections
    ANSIBLE_ROLES_PATH: ../../../../roles
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      test_nodes:
        # Provide test netplan configuration
        netplan_configurations:
          - templates/01-netcfg.yaml.j2

verifier:
  name: ansible
