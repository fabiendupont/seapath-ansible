---
- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    enabled: yes

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Update Grub
  command: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: true
