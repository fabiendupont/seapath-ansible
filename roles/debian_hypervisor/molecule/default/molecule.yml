---
# debian_hypervisor role test scenario
# Compatible with Ansible 2.10 and Molecule 3.x

scenario:
  name: default
  # TODO: Fix idempotence issues before enabling idempotence test
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy

dependency:
  name: galaxy
  options:
    requirements-file: shared/requirements.yml
    force: false

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: hypervisor-test
    box: generic/debian12
    memory: 2048
    cpus: 4
    groups:
      - test_nodes
      - hypervisors
    networks:
      - name: default
        type: dhcp

provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
      timeout: 30
  env:
    ANSIBLE_COLLECTIONS_PATH: ../../../../collections
    ANSIBLE_ROLES_PATH: ../../../../roles
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      test_nodes:
        # Test-specific variables
        ansible_python_interpreter: /usr/bin/python3
        isolcpus: "2-3"
        livemigration_user: livemigration

verifier:
  name: ansible
